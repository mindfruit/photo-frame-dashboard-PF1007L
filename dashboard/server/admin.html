<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Family dashboard · Parents</title>
<style>
  :root { --ink: #111; --mute: #666; --line: #e3e3e3; --bg: #f6f5f2; --accent: #2D5BFF; --bad: #c62828; --ok: #00875a; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 system-ui, -apple-system, sans-serif; color: var(--ink); background: var(--bg); }
  header { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid var(--line); padding: 10px 14px; display: flex; gap: 8px; align-items: center; }
  header { z-index: 4; padding-top: calc(10px + env(safe-area-inset-top)); }
  header h1 { font-size: 20px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header h1 .brand { display: none; }
  #lock { padding: 6px 10px; } #lock .lbl { display: none; }
  .pagehead { display: none !important; }
  /* Navigation: bottom tabs on phones, sidebar from 768px */
  #nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; background: #fff; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(7, 1fr); padding: 4px 2px calc(4px + env(safe-area-inset-bottom)); }
  #nav a { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; text-decoration: none; color: var(--mute); font-size: 10px; padding: 4px 0; border-radius: 10px; white-space: nowrap; overflow: hidden; }
  #nav a .ic { font-size: 20px; line-height: 1.1; }
  #nav a.on { color: var(--accent); background: #eef2ff; font-weight: 600; }
  #nav .badge { position: absolute; top: 0; right: calc(50% - 22px); background: var(--bad); color: #fff; font-size: 10px; border-radius: 99px; padding: 0 5px; line-height: 16px; }
  main { max-width: 760px; margin: 0 auto; padding: 14px 14px calc(84px + env(safe-area-inset-bottom)); }
  #toast { bottom: calc(80px + env(safe-area-inset-bottom)) !important; }
  @media (min-width: 768px) {
    main { margin-left: 210px; }
    @media (min-width: 970px) { main { margin-left: max(210px, calc((100vw - 760px) / 2)); } }
    header h1 { font-size: 18px; } header h1 .brand { display: inline; } header h1 .ptitle { display: none; }
    #lock .lbl { display: inline; }
    .pagehead { display: flex !important; }
    #nav { top: 49px; right: auto; width: 210px; display: block; border-top: 0; border-right: 1px solid var(--line); padding: 12px 10px; }
    #nav a { flex-direction: row; gap: 10px; font-size: 15px; padding: 10px 12px; margin-bottom: 2px; color: var(--ink); }
    #nav a .ic { font-size: 18px; }
    #nav .badge { position: static; margin-left: auto; font-size: 12px; line-height: 18px; padding: 0 7px; }
    main { padding-bottom: 40px; }
    #toast { bottom: 20px !important; }
  }
  .pagehead { display: flex; align-items: baseline; gap: 10px; margin: 2px 0 12px; }
  .pagehead h1 { font-size: 22px; margin: 0; }
  a.back { display: inline-block; text-decoration: none; color: var(--accent); margin: 0 0 8px; font-size: 15px; }
  .subnav { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 12px; padding-right: 32px; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); scrollbar-width: none; }
  .subnav::-webkit-scrollbar { display: none; }
  .subnav a { white-space: nowrap; text-decoration: none; color: var(--ink); padding: 6px 12px; border-radius: 99px; background: #fff; border: 1px solid var(--line); font-size: 14px; }
  .subnav a.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  a.item { text-decoration: none; color: inherit; }
  a.item .chev { color: var(--mute); font-size: 20px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
  h3.sub { flex-basis: 100%; margin: 10px 0 0; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--mute); }
  h3.sub:first-child { margin-top: 0; }
  textarea { font: inherit; padding: 8px; border: 1px solid #ccc; border-radius: 8px; width: 100%; }
  #stale { background: #fff8e1; border: 1px solid #f0d58a; border-radius: 10px; padding: 8px 12px; margin: 0 0 12px; display: flex; gap: 10px; align-items: center; font-size: 14px; }
  [hidden] { display: none !important; }
  #stale[hidden] { display: none; }
  .ha-card-h [data-ha-break-card] { font-size: 13px; padding: 4px 8px; white-space: nowrap; }
  .ha-card-vals { margin-top: 6px; }
  .ha-card-vals > summary { cursor: pointer; font-size: 13px; color: var(--mute); padding: 4px 0; list-style: none; }
  .ha-card-vals > summary::-webkit-details-marker { display: none; }
  .ha-card-vals > summary::before { content: '› '; }
  .ha-card-vals[open] > summary::before { content: '⌄ '; }
  section { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 16px; }
  h2 { margin: 0 0 4px; font-size: 18px; }
  .hint { color: var(--mute); font-size: 13px; margin: 0 0 10px; }
  form.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; padding: 10px 0; border-top: 1px solid var(--line); }
  form.row.new { background: #fafaf8; border-radius: 10px; padding: 10px; border: 1px dashed var(--line); }
  label { display: flex; flex-direction: column; font-size: 12px; color: var(--mute); gap: 2px; flex: 1 1 120px; min-width: 0; }
  label.narrow { flex: 0 1 80px; }
  input, select { font: inherit; padding: 8px; border: 1px solid #ccc; border-radius: 8px; background: #fff; color: var(--ink); width: 100%; }
  input[type=color] { padding: 2px; height: 40px; }
  input[type=checkbox] { width: 22px; height: 22px; }
  .days { display: flex; gap: 2px; }
  .days label { flex: 0 0 auto; align-items: center; font-size: 11px; }
  button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  button.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .item { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .item .grow { flex: 1; min-width: 140px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; background: var(--bg); font-size: 12px; }
  .err { color: var(--bad); font-size: 13px; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #111; color: #fff; padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  #toast.show { opacity: 1; }
  #gate { max-width: 340px; margin: 18vh auto; text-align: center; }
  #gate input { font-size: 28px; text-align: center; letter-spacing: 8px; margin: 12px 0; }
  .wg { flex-basis: 100%; }
  .wg > .lbl { font-size: 12px; color: var(--mute); margin: 0 0 8px; }
  .wg-grid { display: grid; gap: 10px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .wg-grid { grid-template-columns: 1fr 1fr; } }
  .wg-card { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fafaf8; }
  .wg-card h4 { margin: 0 0 2px; font-size: 14px; display: flex; align-items: center; gap: 8px; color: var(--ink); }
  .wg-card h4 button { margin-left: auto; font-size: 12px; padding: 4px 8px; }
  .wg-item { padding: 8px 0 0; border-top: 1px solid var(--line); margin-top: 8px; }
  .wg-item:first-of-type { border-top: 0; margin-top: 4px; padding-top: 4px; }
  .wg-item label { flex-direction: row; align-items: flex-start; gap: 10px; font-size: 14px; color: var(--ink); flex: 1 1 auto; }
  .wg-item input[type=checkbox] { flex: 0 0 auto; margin-top: 1px; }
  .wg-item .desc { display: block; font-size: 12px; color: var(--mute); font-weight: 400; margin-top: 1px; }
  .wg > .lbl:empty { display: none; }
  .card-desc { display: block; font-size: 12px; color: var(--mute); margin: 0 0 2px; }
  .wg-fields { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-top: 8px; }
  h4 .hsw { display: flex; margin-left: auto; flex: 0 0 auto; flex-direction: row; align-items: center; gap: 6px; font-size: 12px; font-weight: 400; color: var(--mute); white-space: nowrap; }
  h4 .hsw input[type=checkbox] { width: 18px; height: 18px; margin: 0; }
  .wg-panel { grid-column: 1 / -1; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; }
  .wg-panel > h4 { margin: 0 0 8px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  form.row > .wg-grid, form.row > .head-fields, form.row > .wg { flex-basis: 100%; width: 100%; }
  .head-fields { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-bottom: 4px; }
  .head-fields button { flex: 0 0 auto; }
  .wg-card form.row { border-top: 0; padding: 6px 0 0; }
  .form-foot { display: flex; gap: 8px; align-items: center; flex-basis: 100%; width: 100%; margin-top: 8px; }
  /* Google Photos section (phone: stacked text, action row underneath) */
  #google .g-text { flex: 1 1 100%; min-width: 0; }
  #google .g-act { display: flex; width: 100%; gap: 8px; }
  #google .g-act .danger { margin-left: auto; border: 0; background: transparent; }
  #google .g-act button, #google .g-act a.btn { white-space: nowrap; }
  #google .g-uri { display: block; font: 13px/1.4 ui-monospace, Menlo, monospace; background: #f1f0ec; border-radius: 8px; padding: 6px 8px; user-select: all; -webkit-user-select: all; word-break: break-all; margin: 4px 0 2px; }
  #google #gClient label { flex: 1 1 100%; }
  @media (min-width: 640px) {
    #google .g-text { flex: 1 1 auto; }
    #google .g-act { width: auto; }
    #google #gClient label { flex: 1 1 200px; }
  }
  .form-foot .danger { margin-left: auto; border: 0; background: transparent; }
  @media (max-width: 639px) { .form-foot .primary { flex: 1; width: 100%; } }
  .empty { background: #fff8e1; border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
  .empty .hint { display: block; margin: 2px 0 0; }
  .empty .act { margin-top: 8px; }
  .full { flex-basis: 100% !important; }
  .item .emo { font-size: 22px; width: 28px; text-align: center; }
  details > summary { cursor: pointer; }
  /* Look card (screens/profiles) + Frame styles card (Photos) */
  .wg-item input[type=radio] { width: 20px; height: 20px; flex: 0 0 auto; margin: 1px 0 0; }
  .fs-row { display: flex; align-items: center; gap: 10px; }
  .fs-row .fs-name { flex: 1 1 auto; min-width: 0; font-size: 14px; color: var(--ink); }
  .fs-row select { width: auto; flex: 0 0 auto; font-size: 13px; padding: 5px 6px; }

  /* Home (HA) area groups */
  .ha-toolbar { margin: 8px 0 6px; }
  .ha-toolbar #haFilter { width: 100%; box-sizing: border-box; }
  .ha-tbrow { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .ha-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .ha-seg button { border: 0; border-radius: 0; padding: 5px 12px; background: #fff; }
  .ha-seg button.on { background: var(--ink); color: #fff; }
  .ha-tbrow [data-ha-new-group] { margin-left: auto; }
  .ha-counts a { cursor: pointer; }
  .ha-group { margin-bottom: 14px; }
  .ha-gtools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
  .ha-gtools input { flex: 1; min-width: 120px; }
  .ha-ent { border-top: 1px solid var(--line); }
  .ha-line { display: flex; gap: 8px; align-items: center; padding: 8px 0; }
  .ha-line .ha-pick { flex: 0 0 auto; margin: 0; }
  .ha-line .ha-pick-sp { flex: 0 0 13px; }
  .ha-line .grow { flex: 1; min-width: 0; }
  .ha-line .grow b, .ha-line .grow small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ha-line select { flex: 0 0 auto; max-width: 110px; }
  .ha-more { flex: 0 0 auto; padding: 4px 8px; font-size: 13px; }
  .ha-edit { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 0 10px 21px; }
  .ha-edit select, .ha-edit input { max-width: 180px; }
  .ha-card-box { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 6px 0; }
  .ha-card-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .ha-card-big { font-size: 22px; font-weight: 700; }
  .ha-card-big small { font-size: 13px; font-weight: 400; color: var(--mute); margin-left: 6px; }
  .ha-card-sec { display: flex; gap: 8px; font-size: 13px; color: var(--mute); padding: 2px 0; }
  .ha-card-sec span { flex: 1; } .ha-card-sec a { cursor: pointer; }
  .ha-card-box .ha-ent { font-size: 13px; }
  .ha-combine { position: sticky; bottom: 0; z-index: 3; background: #fff; border-top: 1px solid var(--line); padding: 10px 0; display: flex; gap: 8px; align-items: center; }
  .ha-combine .hint { flex: 1; margin: 0; }
  a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: inherit; border: 1px solid #ccc; border-radius: 8px; padding: 8px 12px; background: #fff; }
  /* Photo views: per-source grids + storage */
  /* source grid: one header per day, tiles are plain buttons (no delete on the tile: tap opens the photo view) */
  .pday h3 { margin: 16px 0 6px; font-size: 14px; font-weight: 600; color: var(--mute); }
  .pday:first-child h3 { margin-top: 6px; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .ptile { position: relative; min-width: 0; display: block; width: 100%; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 8px; }
  .ptile img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: #ecebe6; }
  .ptile .pbadge { position: absolute; left: 4px; bottom: 4px; font-size: 11px; padding: 1px 6px; border-radius: 99px; background: rgba(0, 0, 0, .55); color: #fff; }
  /* single-photo view (overlay; lives outside the patched sections) */
  #pview { position: fixed; inset: 0; z-index: 20; background: rgba(10, 10, 10, .92); color: #fff; display: flex; flex-direction: column; padding: calc(10px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom)); }
  #pview[hidden] { display: none; }
  #pview .pv-bar { display: flex; align-items: center; gap: 8px; }
  #pview .pv-bar b { flex: 1; font-size: 16px; }
  #pview .pv-x { background: rgba(255, 255, 255, .14); color: #fff; border: 0; font-size: 22px; line-height: 1; padding: 8px 14px; border-radius: 10px; }
  #pview .pv-img { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; margin: 10px 0; }
  #pview .pv-img img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
  #pview .pv-meta { font-size: 14px; color: rgba(255, 255, 255, .8); margin-bottom: 12px; }
  #pview .pv-acts { display: flex; gap: 8px; justify-content: flex-end; }
  .pmore { margin: 12px 0 4px; text-align: center; }
  .pmore button { min-width: 180px; }
  #storeWarn { background: #fdecea; color: #8a1c12; border-radius: 10px; padding: 10px 12px; margin: 0 0 10px; font-size: 14px; }
  #storeWarn.info { background: #eef4ff; color: #1d3f8a; }
  .stat-row { display: flex; flex-wrap: wrap; gap: 6px 16px; flex-basis: 100%; font-size: 14px; }
  .stat-row b { font-size: 16px; }
  .meter { flex-basis: 100%; height: 8px; border-radius: 99px; background: #ecebe6; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); }
  .meter.full i { background: #E08A00; } /* 90% full and up */
  .meter.low i { background: var(--bad); }
  #pdirMsg { flex-basis: 100%; }
  #storage input[name=photos_dir] { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
</style>
</head>
<body>
<div id="gate" hidden>
  <h1 id="gateTitle">Parent PIN</h1>
  <p class="hint" id="gateHint"></p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8">
  <button class="primary" id="pinGo" style="width:100%">Unlock</button>
  <p class="err" id="gateErr"></p>
</div>
<div id="app" hidden>
  <header><h1><span class="brand">Family dashboard</span><span class="ptitle" id="ptitle"></span></h1><button id="lock" aria-label="Lock" title="Lock">🔒<span class="lbl"> Lock</span></button></header>
  <nav id="nav" aria-label="Sections"></nav>
  <main><div id="storeWarn" hidden></div><div id="stale" hidden><span style="flex:1">What you’re editing was changed on another device. Your unsaved edits were kept.</span><button id="staleGo">Show latest</button></div><div id="main"></div></main>
</div>
<div id="toast"></div>
<script>
'use strict';
var PIN = sessionStorage.getItem('pin') || '';
var S = null; // admin state from /api/admin
var $ = function (s, r) { return (r || document).querySelector(s); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
function toast(msg) { var t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('show'); }, 2500); }

// Random id for this tab, sent on writes; the server echoes it on the live event so only our own writes skip the "changed elsewhere" banner.
var CLIENT_ID = Math.random().toString(36).slice(2) + Date.now().toString(36);
function api(method, path, body) {
  return fetch('/api/' + path, { method: method, headers: { 'Content-Type': 'application/json', 'X-PIN': PIN, 'X-Client-Id': CLIENT_ID }, body: body ? JSON.stringify(body) : undefined })
    .then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.status === 401) { lock(); throw new Error(j.error || 'PIN required'); }
        if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
        return j;
      });
    });
}

// ------------------------------------------------------------------ PIN gate
var setupMode = false;
function showGate() {
  $('#app').hidden = true; $('#gate').hidden = false;
  fetch('/api/auth').then(function (r) { return r.json(); }).then(function (a) {
    setupMode = !a.pinSet;
    $('#gateTitle').textContent = setupMode ? 'Create a parent PIN' : 'Parent PIN';
    $('#gateHint').textContent = setupMode ? '4–8 digits. You will need it for this page and for approving chores.' : '';
    $('#pinGo').textContent = setupMode ? 'Save PIN' : 'Unlock';
    $('#pin').focus();
  });
}
function lock() { PIN = ''; sessionStorage.removeItem('pin'); showGate(); }
$('#pinGo').onclick = function () {
  var pin = $('#pin').value.trim();
  fetch('/api/auth' + (setupMode ? '/setup' : ''), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: pin }) })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Wrong PIN'); }); })
    .then(function () { PIN = pin; sessionStorage.setItem('pin', pin); $('#pin').value = ''; $('#gateErr').textContent = ''; load(); })
    .catch(function (e) { $('#gateErr').textContent = e.message; });
};
$('#pin').onkeydown = function (e) { if (e.key === 'Enter') $('#pinGo').click(); };
$('#lock').onclick = lock;
document.addEventListener('click', function (e) { if (e.target.id === 'refresh') refreshFeeds(); });
function refreshFeeds() { api('POST', 'refresh').then(function (r) { toast(Object.keys(r.errors || {}).length ? 'Refreshed with errors' : 'Feeds refreshed'); load(); }).catch(function (e) { toast(e.message); }); }

// ------------------------------------------------------------------ generic editors
var DAYS = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
function peopleOpts(none) { return [['', none]].concat(S.people.map(function (p) { return [String(p.id), p.name]; })); }
function field(f, v) {
  var name = ' name="' + f.k + '"', val = v == null ? '' : v;
  var input;
  if (f.type === 'select') {
    var opts = typeof f.opts === 'function' ? f.opts() : f.opts;
    input = '<select' + name + '>' + opts.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (String(val) === String(o[0]) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>';
  } else if (f.type === 'days') {
    val = val || (v == null ? '0123456' : '');
    return '<div><div style="font-size:12px;color:var(--mute)">' + f.label + '</div><div class="days">' + DAYS.map(function (d, i) {
      return '<label><input type="checkbox" data-day="' + i + '"' + (String(val).indexOf(String(i)) > -1 ? ' checked' : '') + '>' + d + '</label>';
    }).join('') + '</div></div>';
  } else if (f.type === 'widgets') {
    var cur = []; try { cur = typeof val === 'string' ? JSON.parse(val || '[]') : (val || []); } catch (e) {}
    if (v == null && f.def) cur = f.def;
    return '<div class="wg"><div class="lbl">' + f.label + '</div><div class="wg-grid">' + WIDGET_GROUPS.map(function (g) {
      var allOn = g.items.every(function (o) { return cur.indexOf(o[0]) > -1; });
      return '<div class="wg-card"><h4>' + esc(g.title) + '<button type="button" data-wg-all>' + (allOn ? 'Clear' : 'Select all') + '</button></h4>' +
        g.items.map(function (o) {
          return '<div class="wg-item"><label><input type="checkbox" data-multi="' + f.k + '" value="' + o[0] + '"' + (cur.indexOf(o[0]) > -1 ? ' checked' : '') + '><span><b>' + esc(o[1]) + '</b><span class="desc">' + esc(o[2]) + '</span></span></label></div>';
        }).join('') + '</div>';
    }).join('') + '</div></div>';
  } else if (f.type === 'multi') {
    var cur = []; try { cur = typeof val === 'string' ? JSON.parse(val || '[]') : (val || []); } catch (e) {}
    if (v == null && f.def) cur = f.def;

function personEditor(p) {

  var wf = cfg.fields.filter(function (f) { return f.k === 'widgets'; })[0];
  return '<section id="person"><h2>' + esc(p.name) + (p.role === 'kid' ? ' <span class="pill">★ ' + p.stars + '</span>' : '') + '</h2><p class="hint">Their own tab, bedtime light and chore approval.</p>' +
    '<form class="row" data-route="people" data-id="' + p.id + '" style="border-top:0"><div class="wg-grid">' +
    card('Profile', 'Who they are on the dashboard.', fieldsOf(cfg, ['name', 'role', 'color', 'birthday'], p)) +
    card('Bedtime light', 'Ok-to-wake times and the Home Assistant light that shows them.', fieldsOf(cfg, ['bedtime', 'wake', 'wake_light', 'wake_color', 'bed_color'], p)) +
    card('Chores', 'Approval override and who’s-home entity.', fieldsOf(cfg, ['approval', 'ha_entity'], p)) +
    '<div class="wg-panel"><h4>On their tab<label class="hsw">Own tab<input type="checkbox" name="show_tab"' + (p.show_tab == null || p.show_tab === '' || p.show_tab ? ' checked' : '') + '></label></h4>' +
      field({ k: wf.k, label: '', type: 'widgets', def: wf.def }, p.widgets) + '</div>' +
    '</div>' + foot(true) + '</form></section>';
}
function choresPage() {
  var rname = function (id) { var x = S.routines.filter(function (r) { return r.id === id; })[0]; return x ? x.name : ''; };
  return '<section id="chores"><h2>Chores</h2><p class="hint">' + T('chores').hint + '</p>' +
    (S.chores.length ? S.chores.map(function (c) {
      return '<a class="item" href="#/chores/' + c.id + '"><span class="emo">' + esc(c.emoji || '⭐') + '</span><span class="grow"><b>' + esc(c.title) + '</b>' + (c.active ? '' : ' <span class="pill">off</span>') +
        '<br><small class="hint">' + esc(nameOf(c.person_id)) + (rname(c.routine_id) ? ' · ' + esc(rname(c.routine_id)) : '') + ' · ' + dayInitials(c.days) + '</small></span><span class="pill">★ ' + esc(c.stars) + '</span><span class="chev">›</span></a>';
    }).join('') : emptyBox('No chores yet', 'Add the first one below — kids see it on their tab.')) + '</section>' +
    '<section id="addchore"><details><summary><b>Add chore</b></summary>' + newForm(T('chores')) + '</details></section>' +
    '<section id="rewards"><h2>Rewards</h2><p class="hint">' + T('rewards').hint + '</p>' +
    (S.rewards.length ? S.rewards.map(function (w) {
      return '<a class="item" href="#/rewards/' + w.id + '"><span class="emo">' + esc(w.emoji || '🎁') + '</span><span class="grow"><b>' + esc(w.title) + '</b>' + (w.active ? '' : ' <span class="pill">off</span>') + '</span><span class="pill">★ ' + esc(w.cost) + '</span><span class="chev">›</span></a>';
    }).join('') : emptyBox('No rewards yet', 'Add something stars can buy below.')) + '</section>' +
    '<section id="addreward"><details><summary><b>Add reward</b></summary>' + newForm(T('rewards')) + '</details></section>' +
    '<section id="routines"><h2>Routine times</h2><p class="hint">' + T('routines').hint + '</p><div class="wg-grid">' +
    S.routines.map(function (r) { return '<div class="wg-card"><h4>' + esc(r.name) + '</h4>' + rowForm(T('routines'), r) + '</div>'; }).join('') + '</div></section>';
}
function itemDetail(route, id) {
  var cfg = T(route), x = (S[cfg.key] || []).filter(function (r) { return String(r.id) === String(id); })[0];
  var sid = route === 'chores' ? 'chore' : 'reward';
  return '<a class="back" href="#/chores">‹ Chores & rewards</a>' +
    (x ? '<section id="' + sid + '"><h2>' + esc((x.emoji || '') + ' ' + x.title) + '</h2>' + rowForm(cfg, x).replace('<form class="row"', '<form class="row" style="border-top:0"') + '</section>'
       : '<section id="' + sid + '"><p class="hint">That ' + sid + ' no longer exists.</p></section>');
}
function paintNav(r) {
  var n = (S.pending || []).length + (S.rewardRequests || []).length;
  var w = $('#storeWarn'), st = S.storage || {}, mv = st.move;
  if (w) {
    var html = !st.ok ? '⚠ <b>' + esc(st.reason) + '.</b> The frame shows only the photos it can still read (none if the whole folder is gone). Downloads, uploads, album removal sync and deleting photos are paused until the folder is back. <a href="#/settings">Storage settings</a>'
      : mv && mv.state === 'copying' ? 'Moving photos to ' + esc(mv.to) + ': ' + mv.done + ' of ' + mv.total + ' copied and checked. Downloads and deletes wait until it’s done.'
      : st.low ? '⚠ Only ' + gb(st.free) + ' free on the photo disk. <a href="#/settings">Storage</a>' : '';
    w.innerHTML = html; w.hidden = !html; w.className = !st.ok || st.low ? '' : 'info';
  }
  $('#nav').innerHTML = NAV.map(function (x) {
    return '<a href="#/' + x[0] + '"' + (x[0] === r.top ? ' class="on" aria-current="page"' : '') + '><span class="ic">' + x[1] + '</span><span>' + x[2] + '</span>' + (x[0] === 'today' && n ? '<span class="badge">' + n + '</span>' : '') + '</a>';
  }).join('');
}
var lastRouteKey = '';
function render() {
  defineTables();
  var r = route(); if (!r) return;
  var navItem = NAV.filter(function (x) { return x[0] === r.top; })[0];
  $('#ptitle').textContent = r.top === 'chores' ? 'Chores & rewards' : navItem[2];
  paintNav(r);
  $('#main').innerHTML = pageHtml(r);
  stamp($('#main'));
  $('#stale').hidden = true;
  var key = r.top + '/' + r.sub + '/' + (r.id || '');
  if (key !== lastRouteKey) { window.scrollTo(0, 0); lastRouteKey = key; }
  if (r.top === 'settings' && r.sub === 'ha') { var h = $('#ha-settings'); if (h) { h.scrollIntoView({ block: 'start' }); var u = $('[name=ha_url]'); if (u) u.focus({ preventScroll: true }); } }
  if (r.top === 'home' && !HA) loadHA(); // check status as soon as Home opens
  if (r.top === 'photos' && $('#pgrid')) gridLoad(gridSrc(r), true); else GRID = null;
}
window.addEventListener('hashchange', function () { if (S) render(); });
// After a Save/Add/Delete/Approve: refresh S, then redraw only clean panels (drafts elsewhere survive).
// First load, or full=true, redraws everything.
function load(full) {
  var first = $('#app').hidden || !S;
  return api('GET', 'admin').then(function (s) {
    S = s; $('#gate').hidden = true; $('#app').hidden = false;
    if (first || full === true) render(); else patch();
  }).catch(function (e) { if (PIN) toast(e.message); });
}
$('#staleGo').onclick = function () {
  if ($('#main [data-dirty]') && !confirm('Discard your unsaved edits on this page and show the latest?')) return;
  load(true);
};
// The form/row you just acted on is no longer a draft: un-mark it so the refresh can redraw it.
function settle(el) {
  var holder = el && el.closest && (el.closest('form') || el.closest('.item') || el.closest('section'));
  if (!holder) return;
  holder.removeAttribute('data-dirty');
  var sec = holder.closest('section'); if (sec && sec !== holder && !sec.querySelector('form')) sec.removeAttribute('data-dirty');
  var a = document.activeElement; if (a && holder.contains(a) && a.blur) a.blur();
}
document.addEventListener('submit', function (e) { settle(e.target); }, true);
// Clear dirty only after an action is confirmed / starts — not on every button click
// (Delete + Cancel used to leave edits unprotected against live updates).

// ------------------------------------------------------------------ dirty tracking + live patching
// Any edit inside #main marks its form (or section) dirty. HA rows auto-save and the HA search box is local, so they don't count.
function markDirty(e) {
  var t = e.target;
  if (!t.closest || !t.closest('#main') || t.closest('#ha') || t.closest('[data-ha]') || t.closest('[data-fstyle]') || t.id === 'haFilter') return; // frame styles autosave
  if (t.name === 'photos_dir' && t.closest('#storage')) return; // carried over by keepStoreDir instead
  var holder = t.closest('form') || t.closest('section');
  if (holder) holder.setAttribute('data-dirty', '1');
}
document.addEventListener('input', markDirty);
document.addEventListener('change', function (e) {
  markDirty(e);
  var box = e.target.closest && e.target.closest('.wg-card');
  if (box && e.target.matches && e.target.matches('[data-multi],[data-tab]')) {
    var boxes = box.querySelectorAll('[data-multi],[data-tab]');
    var allOn = Array.prototype.every.call(boxes, function (c) { return c.checked; });
    var btn = box.querySelector('[data-wg-all]');
    if (btn) btn.textContent = allOn ? 'Clear' : 'Select all';
  }
});
function isBusy(sec) {
  if (sec.hasAttribute('data-dirty') || sec.querySelector('[data-dirty]')) return true;
  var a = document.activeElement;
  if (a && a.name === 'photos_dir' && sec.id === 'storage') return false; // the folder field is carried over (keepStoreDir): the storage numbers stay live, no banner
  return !!(a && sec.contains(a) && /INPUT|SELECT|TEXTAREA/.test(a.tagName));
}
// The album add form keeps its typed link, its inline error and its busy button across live redraws (like keep-dirty).
function keepAlbumForm(cur, fresh) {
  var o = cur.querySelector('#gAlbum'), n = fresh.querySelector('#gAlbum');
  if (!o || !n) return;
  n.elements.url.value = o.elements.url.value;
  var oe = o.querySelector('[data-aerr]'), ne = n.querySelector('[data-aerr]');
  if (oe && ne) { ne.textContent = oe.textContent; ne.hidden = oe.hidden; }
  var ob = o.querySelector('button'), nb = n.querySelector('button');
  if (ob && nb) { nb.disabled = ob.disabled; nb.textContent = ob.textContent; }
  if (o.hasAttribute('data-dirty')) n.setAttribute('data-dirty', '1');
}
// Re-render the current page off-screen and swap in only the sections nobody is editing.
function patch(quiet) {
  defineTables();
  var r = route(); if (!r) return;
  paintNav(r);
  var tpl = document.createElement('template'), kept = 0, stale = 0;
  tpl.innerHTML = pageHtml(r);
  Array.prototype.forEach.call(tpl.content.querySelectorAll('section[id]'), function (fresh) {
    var cur = document.getElementById(fresh.id);
    if (!cur || fresh.id === 'ha' || fresh.id === 'photoGrid') return; // HA list comes from Home Assistant; loaded thumbnails stay
    if (isBusy(cur)) {
      kept++;
      // banner only when what's being edited changed: the draft form's own row, or (forms without a version) this section
      var forms = cur.querySelectorAll('form'), a = document.activeElement, versioned = false;
      Array.prototype.forEach.call(forms, function (f) {
        if (f._sig == null) return;
        versioned = true;
        if ((f.hasAttribute('data-dirty') || (a && f.contains(a))) && formStale(f)) stale++;
      });
      if (!versioned && cur._base != null && fresh.innerHTML !== cur._base) stale++;
      return;
    }
    var base = fresh.innerHTML; // before the kept album-form bits are copied in
    keepAlbumForm(cur, fresh);
    var om = cur.querySelector('#pdirMsg'), nm = fresh.querySelector('#pdirMsg'); if (om && nm) { nm.innerHTML = om.innerHTML; nm.className = om.className; }
    var refocus = keepStoreDir(cur, fresh);
    cur.parentNode.replaceChild(fresh, cur);
    if (refocus) refocus();
    stamp(fresh); fresh._base = base;
  });
  if (!kept) $('#stale').hidden = true; // everything redrawn → no banner
  else if (stale && !quiet) $('#stale').hidden = false; // a kept draft's own screen/section changed elsewhere (quiet: our own write)
}

// ------------------------------------------------------------------ actions
document.addEventListener('submit', function (e) {
  var form = e.target;
  e.preventDefault();
  if (form.id === 'settingsForm') {
    if (!quietOk(form)) return;
    if (!staleOk(form)) return;
    var body = { quiet_start: form.elements.quiet_start.value, quiet_end: form.elements.quiet_end.value, sounds_muted: form.elements.sounds_muted.checked, learning_items: form.elements.learning_items.value, family_goal_emoji: form.elements.family_goal_emoji.value.trim(),
      family_goal_title: form.elements.family_goal_title.value.trim(), family_goal_stars: form.elements.family_goal_stars.value.trim(), approval_required: form.elements.approval_required.checked, location: form.elements.location.value.trim(), units: form.elements.units.value, ha_url: form.elements.ha_url.value.trim() };
    if (form.elements.ha_token.value.trim()) body.ha_token = form.elements.ha_token.value.trim();
    if (form.elements.clear_ha_token && form.elements.clear_ha_token.checked) body.clear_ha_token = true;
    if (form.elements.new_pin.value.trim()) body.new_pin = form.elements.new_pin.value.trim();
    if (form.elements.kiosk_pin.value.trim()) body.kiosk_pin = form.elements.kiosk_pin.value.trim();
    else if (form.elements.clear_kiosk_pin && form.elements.clear_kiosk_pin.checked) body.clear_kiosk_pin = true;
    if (body.kiosk_pin && !/^\d{4,8}$/.test(body.kiosk_pin)) { form.setAttribute('data-dirty', '1'); return toast('Kiosk PIN must be 4–8 digits'); }
    return api('PUT', 'settings', body).then(function () {
      if (body.new_pin) { PIN = body.new_pin; sessionStorage.setItem('pin', PIN); }
      HA = null; toast('Settings saved'); load();
    }).catch(function (err) { toast(err.message); });
  }
  var cfg = T(form.dataset.route);
  if (!cfg) return;
  var data = readForm(form, cfg.fields), id = form.dataset.id;
  if (cfg.route === 'people' && !data.name) { form.setAttribute('data-dirty', '1'); return toast('Give this person a name first'); }
  api(id ? 'PUT' : 'POST', cfg.route + (id ? '/' + id : ''), data).then(function () { toast(id ? 'Saved' : 'Added'); load(); }).catch(function (err) { toast(err.message); });
});
document.addEventListener('click', function (e) {
  var t = e.target, form = t.closest('form');
  var act = function (p, body, msg) { settle(t); return api('POST', p, body).then(function () { toast(msg); load(); }).catch(function (err) { toast(err.message); }); };
  var wgBtn = t.closest('[data-wg-all]');
  if (wgBtn) {
    var card = wgBtn.closest('.wg-card');
    var boxes = card.querySelectorAll('[data-multi],[data-tab]');
    var allOn = Array.prototype.every.call(boxes, function (c) { return c.checked; });
    Array.prototype.forEach.call(boxes, function (c) { c.checked = !allOn; });
    wgBtn.textContent = allOn ? 'Select all' : 'Clear';
    if (form) form.setAttribute('data-dirty', '1');
    return;
  }
  if (t.hasAttribute('data-del') && form) {
    if (!confirm('Delete this?')) return;
    settle(form);
    return api('DELETE', form.dataset.route + '/' + form.dataset.id).then(function () { toast('Deleted'); if (form.dataset.route === 'people') location.hash = '#/people'; if (/^(chores|rewards)$/.test(form.dataset.route) && location.hash !== '#/chores') location.hash = '#/chores'; load(); }).catch(function (err) { toast(err.message); });
  }
  if (t.dataset.approve) return act('completions/' + t.dataset.approve + '/approve', null, 'Approved ★');
  if (t.dataset.reject) return act('completions/' + t.dataset.reject + '/reject', null, 'Sent back');
  if (t.dataset.rrApprove) return act('redemptions/' + t.dataset.rrApprove + '/approve', null, 'Reward given 🎉');
  if (t.dataset.rrDeny) return act('redemptions/' + t.dataset.rrDeny + '/deny', null, 'Declined');
  if (t.hasAttribute('data-approve-all')) return act('completions/approve-all', null, 'All approved ★');
  if (t.dataset.adj) return act('stars', { person_id: +t.dataset.adj, delta: +t.dataset.d, reason: 'Parent adjustment' }, 'Stars updated');
  if (t.dataset.redeem) {
    var sel = $('[data-reward-for="' + t.dataset.redeem + '"]');
    return act('redeem', { person_id: +t.dataset.redeem, reward_id: +sel.value }, 'Reward redeemed 🎉');
  }
});

// Live: when something changes elsewhere (e.g. a chore is ticked on the frame).
if (window.EventSource) {
  // Never wipes the page: fetch fresh state, then patch only untouched sections (see patch()).
  var es = new EventSource('/api/events'), lt, own = null;
  es.addEventListener('change', function (ev) {
    if (!S || !PIN) return;
    clearTimeout(lt);
    var d = {}; try { d = JSON.parse(ev.data); } catch (x) {}
    own = (own === null ? true : own) && d.client === CLIENT_ID; // a batch is ours only if every event in it is ours
    lt = setTimeout(function () { var o = own; own = null; api('GET', 'admin').then(function (s) { S = s; patch(o); gridRecount(); }).catch(function () {}); }, 300);
  });
  // Photo-move progress: refresh quietly (no "changed elsewhere" banner), at most every 1.5 s.
  var stT = null;
  es.addEventListener('storage', function () {
    if (!S || !PIN || stT) return;
    stT = setTimeout(function () { stT = null; api('GET', 'admin').then(function (s) { S = s; patch(true); }).catch(function () {}); }, 1500);
  });
}
if (PIN) load().then(function () { if (!S) showGate(); }); else showGate();
</script>
</body>
</html>
